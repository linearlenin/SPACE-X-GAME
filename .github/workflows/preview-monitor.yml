name: Preview Monitor

on:
  schedule:
    - cron: '*/15 * * * *' # every 15 minutes
  workflow_dispatch: {}

jobs:
  check-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check preview URL
        run: |
          set -e
          URL="https://space-x-game-git-agents-fix-html-t-0905d7-linearlenins-projects.vercel.app/"
          echo "Checking $URL"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -I "$URL" || true)
          echo "HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "204" ]; then
            echo "Preview appears unhealthy (status=$HTTP_STATUS)"
            exit 1
          fi
          echo "Preview OK"
