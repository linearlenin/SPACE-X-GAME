import sys
import asyncio
import platform
import json
from pathlib import Path

# do not rename
async def custom_site():
    import embed
    platform.document.body.style.background = "#7f7f7f"

    platform.window.transfer.hidden = true
    platform.window.canvas.style.visibility = "visible"


    bundle = "space-x-game"

    # the C or js loader could do that but be explicit.
    appdir = Path(f"/data/data/{bundle}") # /data/data/space-x-game
    appdir.mkdir()


    # unpack filesystem from compressed archive into work dir
    if platform.window.location.host.find('.itch.zone')>0:
        import zipfile
        async with platform.fopen("space-x-game.apk", "rb") as archive:
            with zipfile.ZipFile(archive) as zip_ref:
                zip_ref.extractall(appdir.as_posix())
    else:
        import tarfile
        async with platform.fopen("space-x-game.tar.gz", "rb") as archive:
            tar = tarfile.open(fileobj=archive, mode="r:gz")
            tar.extractall(path=appdir.as_posix(), filter='tar')
            tar.close()

    # preloader will change to work dir and prepend it to sys.path
    platform.run_main(PyConfig, loaderhome= appdir / "assets", loadermain=None)


    # wait preloading complete : that includes images and wasm compilation of bundled modules
    while embed.counter()<0:
        await asyncio.sleep(.1)

    main = appdir / "assets" / "main.py"

    # TODO: test for window.webkitAudioContext and block aio loop until gesture if accessing media manager play
    # before a gesture is recorded ( touch or click )

    # test/wait user media interaction
    if not platform.window.MM.UME:

        # now that apk is mounted we have access to font cache
        # but we need to fill __file__ that is not yet set
        __import__(__name__).__file__ = main

        # optional prompt for sound unlock without blocking startup
        msg  = "Click/touch page to enable audio if needed"
        platform.window.infobox.innerText = msg
        print("\n"*4, f"    * Media user engagement may be required for sound. {msg} *" , "\n"*4)

        # do not block startup; allow the game to render immediately
        platform.window.infobox.style.display = "block"

    # start async top level machinery if not started and add a console in any case if requested.
    await TopLevel_async_handler.start_toplevel(platform.shell, console=window.python.config.debug)

    # now that apk is mounted we have access to font cache
    # but we need to fill __file__/__name__ that are not yet set
    __import__(__name__).__file__ = main


    def ui_callback(pkg):
        platform.window.infobox.innerText = f"installing {pkg}"

    await shell.source(main, callback=ui_callback)

    # if you don't reach that step
    # your main.py has an infinite sync loop somewhere !

    platform.window.infobox.style.display = "none"
    platform.window.config.gui_divider = 1
    platform.window.window_resize()
    print("default.tmpl: done")

    shell.interactive()

asyncio.run( custom_site() )

        const filters = [
            /installHook\.js/, /bus\(\d+\)/, /Unsupported device pixel ratio/, /Connection:/,
            /== FLAGS :/, /terminal \d+ \d+/, /NO ume unlocker/, /TODO: user defined canvas/, /Loading python interpreter/,
            /ScriptProcessorNode is deprecated/, /vtx font:/, /VM\.prerun/, /VM\.postrun/
        ];
        function shouldFilter(args){
            try{
                const s = args.map(a => typeof a === 'string' ? a : (a && a.toString ? a.toString() : JSON.stringify(a))).join(' ');
                return filters.some(re => re.test(s));

    // --- mobile touch controls overlay ---
    // Adds on-screen buttons that synthesize keyboard events targeted at the game canvas
    (function(){
        const css = `
        .touch-controls { position: fixed; left: 0; right: 0; bottom: 6vh; height: 18vh; display: flex; align-items: center; justify-content: space-between; pointer-events: none; z-index: 99999; }
        .touch-group { display:flex; gap: 2vw; padding: 0 4vw; pointer-events: auto; }
        .btn { width: 16vw; max-width:80px; height: 12vh; max-height:64px; background: rgba(0,0,0,0.45); color: #fff; border-radius: 12px; display:flex; align-items:center; justify-content:center; font-weight:600; user-select:none; -webkit-user-select:none; }
        .btn:active { background: rgba(255,255,255,0.15); }
        @media (orientation: landscape) { .touch-controls { bottom: 3vh; height: 14vh }}
        `;
        const s = document.createElement('style'); s.textContent = css; document.head.appendChild(s);

        // create overlay
        const overlay = document.createElement('div'); overlay.className = 'touch-controls';
        const leftGroup = document.createElement('div'); leftGroup.className = 'touch-group';
        const rightGroup = document.createElement('div'); rightGroup.className = 'touch-group';

        const btnLeft = document.createElement('div'); btnLeft.className='btn'; btnLeft.id='touch-left'; btnLeft.innerText='◀';
        const btnRight = document.createElement('div'); btnRight.className='btn'; btnRight.id='touch-right'; btnRight.innerText='▶';
        const btnThrust = document.createElement('div'); btnThrust.className='btn'; btnThrust.id='touch-thrust'; btnThrust.innerText='↑';
        const btnFire = document.createElement('div'); btnFire.className='btn'; btnFire.id='touch-fire'; btnFire.innerText='●';

        leftGroup.appendChild(btnLeft); leftGroup.appendChild(btnRight);
        rightGroup.appendChild(btnThrust); rightGroup.appendChild(btnFire);
        overlay.appendChild(leftGroup); overlay.appendChild(rightGroup);
        document.body.appendChild(overlay);

        // helper: dispatch keyboard events on canvas
        function dispatchKey(canvas, type, keyCode, key) {
            try {
                const ev = new KeyboardEvent(type, { key: key, code: key, keyCode: keyCode, which: keyCode, bubbles: true, cancelable: true });
                canvas.dispatchEvent(ev);
            } catch(e){
                // fallback: dispatch to window
                const ev = document.createEvent('Event'); ev.initEvent(type, true, true); ev.key = key; ev.keyCode = keyCode; window.dispatchEvent(ev);
            }
        }

        // map buttons to keys used by game (adjust if your game uses different keys)
        // default mapping: left = ArrowLeft, right = ArrowRight, thrust = ArrowUp, fire = Space
        const mapping = {
            'touch-left': {down:['keydown',37,'ArrowLeft'], up:['keyup',37,'ArrowLeft']},
            'touch-right':{down:['keydown',39,'ArrowRight'], up:['keyup',39,'ArrowRight']},
            'touch-thrust':{down:['keydown',38,'ArrowUp'], up:['keyup',38,'ArrowUp']},
            'touch-fire':{down:['keydown',32,' '], up:['keyup',32,' ']}
        };

        function bindTouch(el){
            const canvas = document.getElementById('canvas') || document.querySelector('canvas');
            const map = mapping[el.id];
            if(!map) return;
            let active = false;
            const doDown = (ev)=>{ ev.preventDefault(); if(active) return; active=true; dispatchKey(canvas, map.down[0], map.down[1], map.down[2]); el.classList.add('active'); };
            const doUp = (ev)=>{ ev.preventDefault(); if(!active) return; active=false; dispatchKey(canvas, map.up[0], map.up[1], map.up[2]); el.classList.remove('active'); };
            el.addEventListener('touchstart', doDown, {passive:false});
            el.addEventListener('touchend', doUp, {passive:false});
            el.addEventListener('touchcancel', doUp, {passive:false});
            // mouse support for desktop testing
            el.addEventListener('mousedown', doDown);
            window.addEventListener('mouseup', doUp);
        }

        [btnLeft, btnRight, btnThrust, btnFire].forEach(bindTouch);

        // hide overlay on large desktop if you prefer; show when touch-capable
        function updateVisibility(){
            const touchCapable = 'ontouchstart' in window || navigator.maxTouchPoints>0;
            overlay.style.display = touchCapable ? 'flex' : 'none';
        }
        updateVisibility(); window.addEventListener('resize', updateVisibility);

    })();

    </script>
